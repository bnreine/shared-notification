services:
  postgres-dev:
    image: postgres:17
    container_name: postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: notification
    ports:
      - "5432:5432"
    networks:
      - notifications-dev
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
networks:
  notifications-dev:
    external: true
volumes:
    postgres_dev_data: